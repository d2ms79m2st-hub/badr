<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08120e" />
    <meta name="description" content="روابط بدر أبا الخيل للعود والعطور — عزنا بطيبنا" />
    <meta property="og:title" content="بدر أبا الخيل | العود والعطور" />
    <meta property="og:description" content="روابط التواصل الرسمي والتسوق" />
    <meta property="og:type" content="website" />
    <title>بدر أبا الخيل | العود والعطور</title>
    <style>
      :root {
        --paper: #0b2419;
        --paper-2: #102d20;
        --ink: #f5efe4;
        --gold: #d8ba77;
        --gold-soft: #f0dfad;
        --green: #1c4a35;
        --rule: rgba(216, 186, 119, 0.28);
        --muted: #b7c0ae;
        --shadow: rgba(0, 0, 0, 0.34);
        --link-bg: rgba(9, 27, 19, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 12px;
        font-family: Tahoma, "Segoe UI", sans-serif;
        color: var(--ink);
        line-height: 1.7;
        background:
          radial-gradient(circle at top, rgba(28, 74, 53, 0.56), transparent 34%),
          linear-gradient(180deg, var(--paper) 0%, #07130d 100%);
      }

      a {
        color: inherit;
      }

      .page {
        position: relative;
        width: min(92vw, 540px);
        background: rgba(16, 45, 32, 0.9);
        border: 1px solid rgba(216, 186, 119, 0.22);
        border-radius: 26px;
        box-shadow: 0 18px 42px var(--shadow);
        padding: 26px 18px 18px;
        overflow: hidden;
        backdrop-filter: blur(2px);
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(216, 186, 119, 0.06), transparent 45%, rgba(255, 255, 255, 0.02));
        pointer-events: none;
      }

      .brand,
      .links,
      .footer,
      .section-label,
      .bottom-grid {
        position: relative;
        z-index: 1;
      }

      .brand {
        text-align: center;
        margin-bottom: 14px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        color: var(--ink);
        font-weight: 700;
      }

      .subtitle {
        margin: 4px 0 8px;
        color: var(--gold);
        font-size: 1.1rem;
        font-weight: 600;
      }

      .motto {
        margin: 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .motto span {
        color: var(--gold-soft);
        margin: 0 4px;
      }

      .ornament {
        position: relative;
        width: 170px;
        height: 2px;
        margin: 18px auto 20px;
        background: linear-gradient(90deg, transparent 0%, var(--gold) 24%, var(--rule) 50%, var(--gold) 76%, transparent 100%);
        border-radius: 999px;
      }

      .section-label {
        text-align: center;
        color: var(--gold-soft);
        font-weight: 700;
        font-size: 1.02rem;
        margin-bottom: 16px;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 0 0 18px;
      }

      .link {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-height: 62px;
        border-radius: 16px;
        border: 1px solid rgba(216, 186, 119, 0.2);
        background: var(--link-bg);
        color: var(--ink);
        text-decoration: none;
        padding: 12px 16px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      .link:hover,
      .link:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(216, 186, 119, 0.5);
        background: rgba(12, 32, 23, 0.96);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
        outline: none;
      }

      .ico {
        flex-shrink: 0;
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(216, 186, 119, 0.1);
        border: 1px solid rgba(216, 186, 119, 0.18);
        color: var(--gold-soft);
      }

      .ico svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .label {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        flex: 1;
        font-size: 1.02rem;
        font-weight: 700;
        color: var(--ink);
      }

      .bottom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 18px;
      }

      .mini {
        background: rgba(28, 74, 53, 0.2);
        border: 1px solid rgba(216, 186, 119, 0.14);
        border-radius: 12px;
        padding: 12px 10px;
        color: var(--muted);
        text-align: center;
        font-size: 0.84rem;
        line-height: 1.6;
      }

      .mini b {
        display: block;
        margin-bottom: 2px;
        color: var(--ink);
      }

      .footer {
        text-align: center;
        color: var(--gold-soft);
        font-weight: 700;
        font-size: 0.94rem;
        padding-top: 10px;
        border-top: 1px solid rgba(216, 186, 119, 0.18);
      }

      .footer span {
        margin: 0 4px;
      }

      @media (max-width: 420px) {
        .page {
          padding: 18px 12px 14px;
        }

        .link {
          min-height: 58px;
          padding: 10px 12px;
        }

        .ico {
          width: 38px;
          height: 38px;
        }

        .bottom-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .link {
          transition: none;
        }
      }
    </style>
  </head>
