<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08120e">
  <meta name="description" content="روابط بدر أباالخيل للعود والعطور — عزنا بطيبنا">
  <title>بدر أباالخيل | العود والعطور</title>
  <style>
    :root {
      --paper: #0b2419;
      --paper-2: #102d20;
      --ink: #f0eadb;
      --green: #1c4a35;
      --gold: #c2a566;
      --rule: #345342;
      --muted: #b2b9aa;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(28, 74, 53, 0.5), transparent 35%),
        linear-gradient(180deg, var(--paper) 0%, #08120e 100%);
      color: var(--ink);
      font-family: Tahoma, "Segoe UI", sans-serif;
      line-height: 1.6;
      padding: 24px 14px;
    }

    .page {
      width: min(92vw, 520px);
      background: rgba(16, 45, 32, 0.9);
      border: 1px solid rgba(194, 165, 102, 0.22);
      border-radius: 22px;
      box-shadow: 0 18px 42px var(--shadow);
      padding: 26px 18px 18px;
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(194, 165, 102, 0.05), transparent 45%, rgba(255,255,255,0.02));
      pointer-events: none;
    }

    .brand, .links, .footer, .section-label, .bottom-grid {
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 10px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--ink);
      font-weight: 700;
    }

    .subtitle {
      margin: 2px 0 8px;
      color: var(--gold);
      font-size: 1.2rem;
    }

    .motto {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .motto span {
      color: var(--gold);
      margin: 0 4px;
    }

    .ornament {
      width: 170px;
      height: 2px;
      margin: 14px auto 18px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 25%, var(--rule) 50%, var(--gold) 75%, transparent 100%);
      border-radius: 999px;
    }

    .section-label {
      text-align: center;
      color: var(--gold);
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 14px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0 0 18px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 62px;
      border-radius: 16px;
      border: 1px solid rgba(194, 165, 102, 0.22);
      background: rgba(12, 31, 23, 0.9);
      color: var(--ink);
      text-decoration: none;
      padding: 12px 16px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(194, 165, 102, 0.5);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
      outline: none;
    }

    .ico {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(194, 165, 102, 0.1);
      color: var(--gold);
      font-size: 1.35rem;
      font-weight: 700;
      border: 1px solid rgba(194, 165, 102, 0.18);
    }

    .link .label {
      display: inline-flex;
      align-items: center;
      flex: 1;
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--ink);
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 18px;
    }

    .mini {
      background: rgba(28, 74, 53, 0.2);
      border: 1px solid rgba(194, 165, 102, 0.15);
      border-radius: 12px;
      padding: 12px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .mini b {
      color: var(--ink);
      display: block;
      margin-bottom: 2px;
    }

    .footer {
      text-align: center;
      color: var(--gold);
      font-weight: 700;
      font-size: 0.95rem;
      padding-top: 8px;
      border-top: 1px solid rgba(194, 165, 102, 0.15);
    }

    .footer span {
      color: var(--gold);
      margin: 0 4px;
    }

    @media (max-width: 420px) {
      .page {
        padding: 18px 12px 14px;
      }

      .link {
        min-height: 58px;
        padding: 10px 12px;
      }

      .ico {
        width: 38px;
        height: 38px;
      }

      .bottom-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

    <footer class="footer">بدر أباالخيل <span>✦</span> للعود والعطور</footer>
